apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  # Database Users
  DB_USER_AUTH: "{{ .Values.auth.db.user }}"
  DB_USER_ALBUMS: "{{ .Values.albums.db.user }}"
  DB_USER_REVIEWS: "{{ .Values.reviews.db.user }}"
  DB_USER_SOCIAL: "{{ .Values.socials.db.user }}"
  DB_USER_KONG: "{{ .Values.kong.db.user }}"

  # Database Passwords
  DB_PASS_AUTH: "{{ .Values.auth.db.password }}"
  DB_PASS_ALBUMS: "{{ .Values.albums.db.password }}"
  DB_PASS_REVIEWS: "{{ .Values.reviews.db.password }}"
  DB_PASS_SOCIAL: "{{ .Values.socials.db.password }}"
  DB_PASS_KONG: "{{ .Values.kong.db.password }}"

  # JWT Secret
  JWT_SECRET: "{{ .Values.secrets.jwt_secret }}"
