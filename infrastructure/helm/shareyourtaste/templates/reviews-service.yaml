apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: reviews
  ports:
    - port: {{ .Values.reviews.service.port }}
      targetPort: {{ .Values.reviews.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.reviews.replicaCount }}
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app: reviews
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.reviews.db.host }} 5432; do echo waiting for {{ .Values.reviews.db.host }}; sleep 2; done;']
      containers:
      - name: reviews
        image: "{{ .Values.reviews.image.repository }}:{{ .Values.reviews.image.tag }}"
        imagePullPolicy: {{ .Values.reviews.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.reviews.service.port }}
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: DB_URL
          value: "postgresql://$(DB_USER_REVIEWS):$(DB_PASS_REVIEWS)@$(DB_HOST_REVIEWS):5432/$(DB_NAME_REVIEWS)"
